<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" class="book-cover-vector">
  <defs>
    <linearGradient id="back-spine-grad-peb-004s" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="6%" stop-color="#FFF" stop-opacity="0.15"/>
      <stop offset="12%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="book-shadow-back-004s" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="-3" dy="4" stdDeviation="6" flood-color="#1F1505" flood-opacity="0.28"/>
    </filter>
  </defs>

  <!-- Book Back Body -->
  <rect x="15" y="10" width="230" height="320" rx="10" fill="#D99B26" filter="url(#book-shadow-back-004s)"/>

  <!-- Sunburst Ray Motifs -->
  <g stroke="#FFF6DC" stroke-width="1.2" opacity="0.45" fill="none">
    <circle cx="65" cy="65" r="18" fill="#FFF6DC" opacity="0.2"/>
    <line x1="65" y1="35" x2="65" y2="25"/>
    <line x1="65" y1="95" x2="65" y2="105"/>
    <line x1="35" y1="65" x2="25" y2="65"/>
    <line x1="95" y1="65" x2="105" y2="65"/>
    <circle cx="185" cy="275" r="16" fill="#FFF6DC" opacity="0.2"/>
    <line x1="185" y1="248" x2="185" y2="240"/>
    <line x1="185" y1="302" x2="185" y2="310"/>
  </g>

  <!-- Spine Shadow on Right Edge -->
  <rect x="217" y="10" width="28" height="320" rx="6" fill="url(#back-spine-grad-peb-004s)"/>

  <!-- Back Cover Content Frame -->
  <rect x="34" y="32" width="176" height="268" rx="6" fill="#FDFBF7" opacity="0.94" stroke="#D3C3AD" stroke-width="1"/>
  <rect x="38" y="36" width="168" height="260" rx="4" fill="none" stroke="#D99B26" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.7"/>

  <!-- Header: Brand & Emblem -->
  <circle cx="122" cy="58" r="12" fill="#FDF7EA" stroke="#D99B26" stroke-width="0.8"/>
  <circle cx="122" cy="58" r="5" fill="#D99B26"/>
  <text x="122" y="79" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="700" fill="#232220" text-anchor="middle" letter-spacing="1.2">PEBBLE</text>
  <text x="122" y="90" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#8C6E2A" text-anchor="middle" letter-spacing="0.8">PLANNER ATELIER</text>

  <!-- Divider line -->
  <line x1="60" y1="100" x2="184" y2="100" stroke="#E8D9B8" stroke-width="0.8"/>

  <!-- Blurb Description -->
  <text x="122" y="118" font-family="'Playfair Display', Georgia, serif" font-size="10.5" font-style="italic" font-weight="600" fill="#D99B26" text-anchor="middle">Sunburst Ochre</text>
  <text x="122" y="134" font-family="'Inter', sans-serif" font-size="7.5" fill="#232220" text-anchor="middle">Undated 12-Month Productivity Planner</text>
  <text x="122" y="148" font-family="'Inter', sans-serif" font-size="7" fill="#695C42" text-anchor="middle">100 GSM smooth bond paper designed for daily</text>
  <text x="122" y="160" font-family="'Inter', sans-serif" font-size="7" fill="#695C42" text-anchor="middle">habit tracking, monthly milestones, and goal grids.</text>
  <text x="122" y="172" font-family="'Inter', sans-serif" font-size="7" fill="#695C42" text-anchor="middle">Linen fabric finish with reinforced section binding.</text>

  <!-- Specs Mini Box -->
  <rect x="48" y="184" width="148" height="34" rx="4" fill="#FDF7EA" stroke="#E8D9B8" stroke-width="0.6"/>
  <text x="122" y="197" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#232220" text-anchor="middle" letter-spacing="0.5">220 PAGES • HABIT &amp; GOAL GRIDS</text>
  <text x="122" y="210" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#8C6E2A" text-anchor="middle">B5 MEDIUM (17.6 × 25.0 CM)</text>

  <!-- Barcode Simulation Area -->
  <g fill="#232220" opacity="0.85">
    <rect x="68" y="232" width="2" height="26"/>
    <rect x="72" y="232" width="1" height="26"/>
    <rect x="75" y="232" width="3" height="26"/>
    <rect x="80" y="232" width="1" height="26"/>
    <rect x="83" y="232" width="2" height="26"/>
    <rect x="87" y="232" width="4" height="26"/>
    <rect x="93" y="232" width="1" height="26"/>
    <rect x="96" y="232" width="2" height="26"/>
    <rect x="100" y="232" width="3" height="26"/>
    <rect x="105" y="232" width="1" height="26"/>
    <rect x="108" y="232" width="2" height="26"/>
    <rect x="112" y="232" width="4" height="26"/>
    <rect x="118" y="232" width="1" height="26"/>
    <rect x="121" y="232" width="2" height="26"/>
    <rect x="125" y="232" width="3" height="26"/>
    <rect x="130" y="232" width="1" height="26"/>
    <rect x="133" y="232" width="2" height="26"/>
    <rect x="137" y="232" width="4" height="26"/>
    <rect x="143" y="232" width="1" height="26"/>
    <rect x="146" y="232" width="2" height="26"/>
    <rect x="150" y="232" width="3" height="26"/>
    <rect x="155" y="232" width="2" height="26"/>
    <rect x="159" y="232" width="1" height="26"/>
    <rect x="163" y="232" width="3" height="26"/>
    <rect x="168" y="232" width="2" height="26"/>
    <rect x="172" y="232" width="2" height="26"/>
  </g>
  <text x="122" y="268" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#5A5248" text-anchor="middle" letter-spacing="1.5">ISBN 978-81-92345-03-6</text>

  <!-- Tagline at Bottom -->
  <text x="122" y="284" font-family="'Inter', sans-serif" font-size="6.2" font-weight="500" fill="#8C6E2A" text-anchor="middle">Every sunrise brings a blank page.</text>
</svg>