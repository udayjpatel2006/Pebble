<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 260 340" class="book-cover-vector">
  <defs>
    <linearGradient id="back-spine-grad-peb-002" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="6%" stop-color="#FFF" stop-opacity="0.15"/>
      <stop offset="12%" stop-color="#000" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </linearGradient>
    <filter id="book-shadow-back-002" x="-5%" y="-5%" width="115%" height="115%">
      <feDropShadow dx="-3" dy="4" stdDeviation="6" flood-color="#0A111F" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Book Back Body -->
  <rect x="15" y="10" width="230" height="320" rx="10" fill="#1B2A47" filter="url(#book-shadow-back-002)"/>

  <!-- Celestial Constellation Shimmer Pattern -->
  <g stroke="#C2D8FF" stroke-width="0.8" opacity="0.55" fill="none">
    <line x1="60" y1="60" x2="100" y2="80" />
    <line x1="100" y1="80" x2="150" y2="50" />
    <circle cx="60" cy="60" r="2.5" fill="#FFF" />
    <circle cx="100" cy="80" r="3.5" fill="#FFD166" />
    <circle cx="150" cy="50" r="3" fill="#FFF" />
    <line x1="70" y1="270" x2="120" y2="285" />
    <line x1="120" y1="285" x2="170" y2="265" />
    <circle cx="70" cy="270" r="2" fill="#FFF" />
    <circle cx="120" cy="285" r="3" fill="#FFF" />
    <circle cx="170" cy="265" r="2.5" fill="#FFD166" />
  </g>

  <!-- Spine Shadow on Right Edge -->
  <rect x="217" y="10" width="28" height="320" rx="6" fill="url(#back-spine-grad-peb-002)"/>

  <!-- Back Cover Content Frame -->
  <rect x="34" y="32" width="176" height="268" rx="6" fill="#FDFBF7" opacity="0.94" stroke="#D3C3AD" stroke-width="1"/>
  <rect x="38" y="36" width="168" height="260" rx="4" fill="none" stroke="#1B2A47" stroke-width="0.8" stroke-dasharray="3 2" opacity="0.7"/>

  <!-- Header: Brand & Emblem -->
  <circle cx="122" cy="58" r="12" fill="#EBF1FA" stroke="#1B2A47" stroke-width="0.8"/>
  <polygon points="122,50 125,56 131,58 125,60 122,66 119,60 113,58 119,56" fill="#1B2A47"/>
  <text x="122" y="79" font-family="'Playfair Display', Georgia, serif" font-size="11" font-weight="700" fill="#1B2A47" text-anchor="middle" letter-spacing="1.2">PEBBLE</text>
  <text x="122" y="90" font-family="'Inter', sans-serif" font-size="7.5" font-weight="600" fill="#54606E" text-anchor="middle" letter-spacing="0.8">CELESTIAL COLLECTION</text>

  <!-- Divider line -->
  <line x1="60" y1="100" x2="184" y2="100" stroke="#C5D3E8" stroke-width="0.8"/>

  <!-- Blurb Description -->
  <text x="122" y="118" font-family="'Playfair Display', Georgia, serif" font-size="10.5" font-style="italic" font-weight="600" fill="#1B2A47" text-anchor="middle">Midnight Constellations</text>
  <text x="122" y="134" font-family="'Inter', sans-serif" font-size="7.5" fill="#232220" text-anchor="middle">Deep Velvet Touch Celestial Journal</text>
  <text x="122" y="148" font-family="'Inter', sans-serif" font-size="7" fill="#54606E" text-anchor="middle">240 acid-free cream pages with feathered ruling.</text>
  <text x="122" y="160" font-family="'Inter', sans-serif" font-size="7" fill="#54606E" text-anchor="middle">Engineered to lay flat at 180° for stargazers,</text>
  <text x="122" y="172" font-family="'Inter', sans-serif" font-size="7" fill="#54606E" text-anchor="middle">dreamers, nocturnal writers &amp; creators.</text>

  <!-- Specs Mini Box -->
  <rect x="48" y="184" width="148" height="34" rx="4" fill="#EBF1FA" stroke="#C5D3E8" stroke-width="0.6"/>
  <text x="122" y="197" font-family="'Inter', sans-serif" font-size="7" font-weight="700" fill="#1B2A47" text-anchor="middle" letter-spacing="0.5">240 PAGES • FEATHERED RULED</text>
  <text x="122" y="210" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#54606E" text-anchor="middle">A5 (14.8 × 21.0 CM) • SILVER FOIL</text>

  <!-- Barcode Simulation Area -->
  <g fill="#1B2A47" opacity="0.85">
    <rect x="68" y="232" width="2" height="26"/>
    <rect x="72" y="232" width="1" height="26"/>
    <rect x="75" y="232" width="3" height="26"/>
    <rect x="80" y="232" width="1" height="26"/>
    <rect x="83" y="232" width="2" height="26"/>
    <rect x="87" y="232" width="4" height="26"/>
    <rect x="93" y="232" width="1" height="26"/>
    <rect x="96" y="232" width="2" height="26"/>
    <rect x="100" y="232" width="3" height="26"/>
    <rect x="105" y="232" width="1" height="26"/>
    <rect x="108" y="232" width="2" height="26"/>
    <rect x="112" y="232" width="4" height="26"/>
    <rect x="118" y="232" width="1" height="26"/>
    <rect x="121" y="232" width="2" height="26"/>
    <rect x="125" y="232" width="3" height="26"/>
    <rect x="130" y="232" width="1" height="26"/>
    <rect x="133" y="232" width="2" height="26"/>
    <rect x="137" y="232" width="4" height="26"/>
    <rect x="143" y="232" width="1" height="26"/>
    <rect x="146" y="232" width="2" height="26"/>
    <rect x="150" y="232" width="3" height="26"/>
    <rect x="155" y="232" width="2" height="26"/>
    <rect x="159" y="232" width="1" height="26"/>
    <rect x="163" y="232" width="3" height="26"/>
    <rect x="168" y="232" width="2" height="26"/>
    <rect x="172" y="232" width="2" height="26"/>
  </g>
  <text x="122" y="268" font-family="'Inter', sans-serif" font-size="6.5" font-weight="600" fill="#1B2A47" text-anchor="middle" letter-spacing="1.5">ISBN 978-81-92345-02-9</text>

  <!-- Tagline at Bottom -->
  <text x="122" y="284" font-family="'Inter', sans-serif" font-size="6.2" font-weight="500" fill="#54606E" text-anchor="middle">Bound for your deepest midnight thoughts.</text>
</svg>